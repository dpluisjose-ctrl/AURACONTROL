<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" /> <!-- indigo-950 -->
      <stop offset="50%" stop-color="#1e1b4b" /> <!-- indigo-900 -->
      <stop offset="100%" stop-color="#020617" /> <!-- slate-950 -->
    </linearGradient>
    
    <!-- Aura Ring Gradient -->
    <linearGradient id="auraGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" /> <!-- indigo-600 -->
      <stop offset="50%" stop-color="#a855f7" /> <!-- purple-500 -->
      <stop offset="100%" stop-color="#ec4899" /> <!-- pink-500 -->
    </linearGradient>

    <!-- Sparkle Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c084fc" /> <!-- purple-400 -->
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Aura Ring (Glowing) -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#auraGrad)" stroke-width="24" filter="url(#glow)" opacity="0.85" />

  <!-- Inner Sparkle Geometric Motif (Representing AI & Assistant Aura) -->
  <g transform="translate(256, 256)">
    <!-- Central Large Sparkle -->
    <path d="M 0,-110 C 12,-40 40,-12 110,0 C 40,12 12,40 0,110 C -12,40 -40,12 -110,0 C -40,-12 -12,-40 0,-110 Z" fill="url(#sparkleGrad)" />
    
    <!-- Secondary Small Sparkle Top-Right -->
    <path d="M 110,-110 C 115,-85 125,-75 150,-70 C 125,-65 115,-55 110,-30 C 105,-55 95,-65 70,-70 C 95,-75 105,-85 110,-110 Z" fill="url(#sparkleGrad)" opacity="0.9" />

    <!-- Tertiary Small Sparkle Bottom-Left -->
    <path d="M -110,110 C -105,135 -95,145 -70,150 C -95,155 -105,165 -110,190 C -115,165 -125,155 -150,150 C -125,145 -115,135 -110,110 Z" fill="url(#sparkleGrad)" opacity="0.75" />
  </g>
</svg>
